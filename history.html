<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cortex Band - Receipts</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen text-gray-900 antialiased">
    
    <div class="w-full md:max-w-xl mx-auto bg-white min-h-screen shadow-2xl flex flex-col relative border-x-4 border-gray-300">
        
        <!-- Header -->
        <div class="bg-blue-800 border-b-4 border-blue-900 px-6 py-5 flex justify-between items-center z-10 sticky top-0 text-white shadow-md">
            <h1 class="text-xl font-bold tracking-widest uppercase">Order History</h1>
        </div>

        <!-- History Content -->
        <div class="flex-grow px-6 py-8 overflow-y-auto pb-32 bg-gray-50">
            <div id="receipt-list" class="space-y-6">
                <div class="text-center text-gray-500 py-12 font-bold uppercase tracking-wider bg-white border-2 border-gray-300 rounded-none">Loading receipts...</div>
            </div>
        </div>
        
        <!-- Navigation Bar -->
        <div class="absolute bottom-0 w-full bg-gray-900 border-t-4 border-gray-800 flex justify-around p-0 text-sm font-bold text-gray-400 z-50 uppercase tracking-widest">
            <a href="cart.html" class="flex flex-col items-center hover:text-white hover:bg-gray-800 w-1/2 py-3 border-r-2 border-gray-700 transition-colors rounded-none">
                <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                Cart
            </a>
            <a href="history.html" class="flex flex-col items-center text-white bg-gray-800 w-1/2 py-3 transition-colors rounded-none">
                <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path></svg>
                Receipts
            </a>
        </div>
    </div>
    
    <script>
        const API_URL = '/api';
        
        async function loadHistory() {
            const currentDeviceId = localStorage.getItem('cortex_device_id');
            if(!currentDeviceId) {
                document.getElementById('receipt-list').innerHTML = '<div class="text-center text-gray-500 py-12 font-bold uppercase tracking-wider bg-white border-2 border-gray-300 rounded-none">Please pair your band first.</div>';
                return;
            }

            try {
                const res = await fetch(API_URL + '/history?deviceId=' + currentDeviceId);
                if(!res.ok) throw new Error("API Error");
                const history = await res.json();
                
                const list = document.getElementById('receipt-list');
                
                if(!history || history.length === 0) {
                    list.innerHTML = '<div class="text-center text-gray-500 py-12 font-bold uppercase tracking-wider bg-white border-2 border-gray-300 rounded-none">No past orders found.</div>';
                    return;
                }
                
                list.innerHTML = history.map(order => {
                    const dateObj = new Date(order.date);
                    const dateStr = dateObj.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
                    
                    const itemsHtml = order.items.map(i => `
                        <li class="flex justify-between py-2 text-sm border-b border-gray-100 last:border-0">
                            <span class="text-gray-800 font-bold uppercase"><span class="text-blue-700 mr-2">${i.quantity}X</span>${i.name}</span> 
                            <span class="text-gray-900 font-black">$${(i.price * i.quantity).toFixed(2)}</span>
                        </li>
                    `).join('');

                    return `
                    <div class="bg-white border-2 border-gray-300 shadow-sm p-6 relative rounded-none">
                        <div class="absolute top-0 left-0 bg-gray-800 text-white px-3 py-1 text-xs font-bold uppercase tracking-wider -mt-3 ml-4 border-2 border-gray-800">Order #${order.id.toString().padStart(4, '0')}</div>
                        
                        <div class="flex justify-end mb-4">
                            <span class="text-xs text-gray-500 font-bold uppercase tracking-wider">${dateStr}</span>
                        </div>
                        
                        <ul class="mb-4">
                            ${itemsHtml}
                        </ul>
                        
                        <div class="flex justify-between items-center border-t-2 border-gray-800 pt-4 mt-2">
                            <span class="text-sm font-bold text-gray-600 uppercase tracking-widest">Total Paid</span>
                            <span class="font-black text-2xl text-gray-900">$${order.total.toFixed(2)}</span>
                        </div>
                    </div>
                    `;
                }).join('');
                
            } catch (err) {
                console.error(err);
                document.getElementById('receipt-list').innerHTML = '<div class="text-red-600 text-center py-4 w-full text-sm font-bold uppercase tracking-wider">Error loading receipts.</div>';
            }
        }
        
        loadHistory();
    </script>
</body>
</html>
