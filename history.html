<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cortex Band - Receipts</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-900 antialiased">
    
    <div class="w-full md:max-w-xl mx-auto bg-white min-h-screen shadow-2xl flex flex-col relative border-x border-slate-200">
        
        <!-- Header -->
        <div class="bg-white border-b border-slate-100 px-6 py-4 flex justify-between items-center z-10 sticky top-0">
            <h1 class="text-lg font-semibold tracking-tight">Order History</h1>
        </div>

        <!-- History Content -->
        <div class="flex-grow px-6 py-6 overflow-y-auto pb-24 bg-slate-50">
            <div id="receipt-list" class="space-y-4">
                <div class="text-center text-slate-400 py-12 text-sm border-2 border-dashed border-slate-200 rounded-lg">Loading receipts...</div>
            </div>
        </div>
        
        <!-- Navigation Bar -->
        <div class="absolute bottom-0 w-full bg-slate-50 border-t border-slate-200 flex justify-around p-2 text-xs font-medium text-slate-400 z-50">
            <a href="cart.html" class="flex flex-col items-center hover:text-slate-900 transition-colors w-1/2 py-2">
                <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                Cart
            </a>
            <a href="history.html" class="flex flex-col items-center text-slate-900 transition-colors w-1/2 py-2">
                <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path></svg>
                Receipts
            </a>
        </div>
    </div>
    
    <script>
        const API_URL = '/api';
        
        async function loadHistory() {
            const currentDeviceId = localStorage.getItem('cortex_device_id');
            if(!currentDeviceId) {
                document.getElementById('receipt-list').innerHTML = '<div class="text-center text-slate-400 py-12 text-sm border-2 border-dashed border-slate-200 rounded-lg">Please pair your band on the Cart page to see receipts.</div>';
                return;
            }

            try {
                const res = await fetch(API_URL + '/history?deviceId=' + currentDeviceId);
                if(!res.ok) throw new Error("API Error");
                const history = await res.json();
                
                const list = document.getElementById('receipt-list');
                
                if(!history || history.length === 0) {
                    list.innerHTML = '<div class="text-center text-slate-400 py-12 text-sm border-2 border-dashed border-slate-200 rounded-lg">No past orders found.</div>';
                    return;
                }
                
                list.innerHTML = history.map(order => {
                    const dateObj = new Date(order.date);
                    const dateStr = dateObj.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
                    
                    const itemsHtml = order.items.map(i => `
                        <li class="flex justify-between py-1.5 text-sm">
                            <span class="text-slate-700"><span class="text-slate-400 mr-2">${i.quantity}x</span>${i.name}</span> 
                            <span class="text-slate-900 font-medium">$${(i.price * i.quantity).toFixed(2)}</span>
                        </li>
                    `).join('');

                    return `
                    <div class="bg-white border border-slate-200 rounded-xl p-5 shadow-sm">
                        <div class="flex justify-between items-center border-b border-slate-100 pb-3 mb-3">
                            <div class="flex items-center gap-2">
                                <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                                <span class="font-semibold text-slate-900 text-sm">Order #${order.id.toString().padStart(4, '0')}</span>
                            </div>
                            <span class="text-xs text-slate-500 font-medium">${dateStr}</span>
                        </div>
                        <ul class="mb-4">
                            ${itemsHtml}
                        </ul>
                        <div class="flex justify-between items-center border-t border-slate-100 pt-3">
                            <span class="text-sm font-medium text-slate-500">Total Paid</span>
                            <span class="font-bold text-lg text-slate-900">$${order.total.toFixed(2)}</span>
                        </div>
                    </div>
                    `;
                }).join('');
                
            } catch (err) {
                console.error(err);
                document.getElementById('receipt-list').innerHTML = '<div class="text-red-500 text-center py-4 w-full text-sm">Error loading receipts. Ensure you are connected.</div>';
            }
        }
        
        loadHistory();
    </script>
</body>
</html>
