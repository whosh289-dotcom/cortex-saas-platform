<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cortex Band - Checkout</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-900 antialiased">
    
    <div class="w-full md:max-w-xl mx-auto bg-white min-h-screen shadow-2xl flex flex-col relative">
        
        <!-- Header -->
        <div class="bg-white/80 backdrop-blur-md px-6 py-5 flex justify-between items-center z-10 sticky top-0 border-b border-slate-100">
            <div class="flex items-center gap-3">
                <div class="bg-indigo-600 p-2 rounded-lg text-white">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z"></path></svg>
                </div>
                <h1 class="text-xl font-bold tracking-tight text-slate-900">Cortex Cart</h1>
            </div>
            <button onclick="document.getElementById('pair-modal').classList.remove('hidden')" class="text-sm font-semibold text-indigo-600 bg-indigo-50 hover:bg-indigo-100 px-4 py-2 rounded-full transition-colors">
                Pair Band
            </button>
        </div>

        <!-- Cart Content -->
        <div class="flex-grow px-6 py-8 overflow-y-auto pb-32 bg-slate-50/50">
            <div class="flex justify-between items-end mb-6">
                <h2 class="text-2xl font-bold text-slate-800">Your Items</h2>
                <span id="item-count" class="text-sm font-medium text-slate-500 bg-white px-3 py-1 rounded-full shadow-sm border border-slate-100">0 Items</span>
            </div>
            
            <div id="cart-list" class="space-y-4">
                <div class="text-center text-slate-400 py-16 text-sm font-medium bg-white rounded-2xl border-2 border-dashed border-slate-200">
                    Your cart is empty.<br>Pair your band and start scanning!
                </div>
            </div>
        </div>
        
        <!-- Checkout Footer -->
        <div class="absolute bottom-16 w-full bg-white/90 backdrop-blur-xl border-t border-slate-100 p-6 z-40 rounded-t-3xl shadow-[0_-10px_40px_-15px_rgba(0,0,0,0.1)]">
            <div class="flex justify-between items-end mb-5 px-2">
                <span class="text-sm font-semibold text-slate-500">Total to pay</span>
                <span id="cart-total" class="text-3xl font-bold tracking-tight text-slate-900">$0.00</span>
            </div>
            <button id="checkout-btn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-4 rounded-2xl transition-all shadow-lg shadow-indigo-600/20 flex justify-center items-center gap-2 text-lg active:scale-[0.98]">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                Secure Checkout
            </button>
        </div>

        <!-- Navigation Bar -->
        <div class="absolute bottom-0 w-full bg-white border-t border-slate-100 flex justify-around p-1 text-xs font-medium text-slate-400 z-50">
            <a href="cart.html" class="flex flex-col items-center text-indigo-600 w-1/2 py-3 transition-colors">
                <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                Cart
            </a>
            <a href="history.html" class="flex flex-col items-center hover:text-indigo-600 w-1/2 py-3 transition-colors">
                <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 00-2-2h-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path></svg>
                Receipts
            </a>
        </div>
    </div>

    <!-- Pairing Modal -->
    <div id="pair-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center z-50 p-4 transition-opacity">
        <div class="bg-white p-8 max-w-sm w-full shadow-2xl rounded-3xl relative">
            <div class="text-center mb-6">
                <div class="mx-auto bg-indigo-100 text-indigo-600 w-12 h-12 flex items-center justify-center rounded-full mb-4">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"></path></svg>
                </div>
                <h3 class="text-xl font-bold text-slate-900">Pair Device</h3>
                <p class="text-sm text-slate-500 mt-2">Enter the 6-character code printed on your Cortex Band box.</p>
            </div>
            
            <input type="text" id="pair-code-input" placeholder="A1B2C3" maxlength="6" class="w-full text-center text-3xl tracking-[0.2em] font-mono border-2 border-slate-200 bg-slate-50 rounded-xl p-4 mb-6 outline-none focus:border-indigo-600 focus:bg-white transition-all uppercase text-slate-800">
            
            <div class="flex gap-3">
                <button onclick="document.getElementById('pair-modal').classList.add('hidden')" class="w-1/2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold py-3.5 rounded-xl transition-colors">
                    Cancel
                </button>
                <button onclick="pairBand()" class="w-1/2 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3.5 rounded-xl transition-all shadow-md shadow-indigo-600/20">
                    Connect
                </button>
            </div>
        </div>
    </div>

    <script>
        const API_URL = '/api';
        
        async function fetchCart() {
            const currentDeviceId = localStorage.getItem('cortex_device_id');
            if(!currentDeviceId) {
                document.getElementById('pair-modal').classList.remove('hidden');
                return;
            }

            try {
                const res = await fetch(API_URL + '/cart?deviceId=' + currentDeviceId);
                if(!res.ok) throw new Error("API Error");
                const data = await res.json();
                
                const list = document.getElementById('cart-list');
                const totalEl = document.getElementById('cart-total');
                const countEl = document.getElementById('item-count');
                
                if(!data.items || data.items.length === 0) {
                    list.innerHTML = '<div class="text-center text-slate-400 py-16 text-sm font-medium bg-white rounded-2xl border-2 border-dashed border-slate-200">Your cart is empty.<br>Scan an item to add it!</div>';
                    totalEl.innerText = "$0.00";
                    countEl.innerText = "0 Items";
                    document.getElementById('checkout-btn').disabled = true;
                    document.getElementById('checkout-btn').classList.add('opacity-50', 'cursor-not-allowed');
                    return;
                }
                
                document.getElementById('checkout-btn').disabled = false;
                document.getElementById('checkout-btn').classList.remove('opacity-50', 'cursor-not-allowed');

                let totalCount = 0;
                list.innerHTML = data.items.map(item => {
                    totalCount += item.quantity;
                    return `
                    <div class="flex justify-between items-center bg-white border border-slate-100 p-4 rounded-2xl shadow-sm hover:shadow-md transition-shadow">
                        <div class="flex items-center gap-4">
                            <div class="bg-indigo-50 text-indigo-700 font-semibold px-3 py-1.5 text-sm rounded-lg border border-indigo-100/50">
                                ${item.quantity}
                            </div>
                            <span class="font-semibold text-slate-800 text-base">${item.name}</span>
                        </div>
                        <span class="font-bold text-slate-900 text-lg">$${(item.price * item.quantity).toFixed(2)}</span>
                    </div>
                    `;
                }).join('');
                
                totalEl.innerText = `$${data.total.toFixed(2)}`;
                countEl.innerText = `${totalCount} Item${totalCount !== 1 ? 's' : ''}`;
                
            } catch (err) {
                console.error(err);
            }
        }
        
        setInterval(() => {
            if(localStorage.getItem('cortex_device_id') && document.getElementById('pair-modal').classList.contains('hidden')) {
                fetchCart();
            }
        }, 2000);
        
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            if (!urlParams.get('success') && !urlParams.get('canceled')) {
                fetchCart();
            }

            if(urlParams.get('success') === 'true') {
                const btn = document.getElementById('checkout-btn');
                btn.innerText = "Payment Successful";
                btn.classList.replace('bg-indigo-600', 'bg-emerald-500');
                btn.classList.replace('hover:bg-indigo-700', 'hover:bg-emerald-600');
                btn.classList.replace('shadow-indigo-600/20', 'shadow-emerald-500/20');
                
                window.history.replaceState({}, document.title, window.location.pathname);
                
                const deviceId = localStorage.getItem('cortex_device_id');
                if (deviceId) {
                    fetch(API_URL + '/cart/checkout', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ deviceId })
                    }).then(() => {
                        setTimeout(() => {
                            btn.innerHTML = `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg> Secure Checkout`;
                            btn.classList.replace('bg-emerald-500', 'bg-indigo-600');
                            btn.classList.replace('hover:bg-emerald-600', 'hover:bg-indigo-700');
                            btn.classList.replace('shadow-emerald-500/20', 'shadow-indigo-600/20');
                            fetchCart();
                        }, 2500);
                    });
                }
            }
            if(urlParams.get('canceled') === 'true') {
                window.history.replaceState({}, document.title, window.location.pathname);
            }
        });
        
        function pairBand() {
            const code = document.getElementById('pair-code-input').value.trim().toUpperCase();
            if(code.length < 6) return alert("Please enter the 6-character code.");
            localStorage.setItem('cortex_device_id', code);
            document.getElementById('pair-modal').classList.add('hidden');
            fetchCart();
        }

        document.getElementById('checkout-btn').addEventListener('click', async () => {
            const currentDeviceId = localStorage.getItem('cortex_device_id');
            if(!currentDeviceId) return;
            
            const btn = document.getElementById('checkout-btn');
            btn.innerText = "Processing...";
            btn.disabled = true;

            try {
                const res = await fetch(API_URL + '/cart/create-checkout-session', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ deviceId: currentDeviceId })
                });
                const data = await res.json();
                if(data.url) window.location.href = data.url;
                else throw new Error(data.error || "Failed to create session");
            } catch(e) {
                alert(e.message);
                btn.innerHTML = `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg> Secure Checkout`;
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
